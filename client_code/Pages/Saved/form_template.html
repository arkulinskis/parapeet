<anvil-form layout="parapeet.Layouts.Shell">
  <anvil-block slot="content">
    <div class="ui-wrap sv-wrap">
      <div class="ui-page-head">
        <div>
          <h1>My phrasebook</h1>
          <anvil-component type="Label" name="count" prop:role='["fine-print"]'></anvil-component>
        </div>
        <div class="ui-row">
          <anvil-component type="Button" name="quiz_button" prop:text="Quiz me" prop:role='["btn", "ic-target"]'></anvil-component>
          <anvil-component type="Button" name="add_button" prop:text="Add a phrase" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component>
        </div>
      </div>

      <div class="ui-card sv-quiz" anvil:name="quiz_part">
        <div class="sv-quiz-head">
          <span class="eyebrow">Quiz</span>
          <anvil-component type="Label" name="quiz_count" prop:role='["fine-print"]'></anvil-component>
          <anvil-component type="Button" name="quiz_close" prop:text="Close the quiz" prop:role='["btn", "btn-sm", "btn-ghost", "ic-x"]'></anvil-component>
        </div>
        <p class="small muted">Here's what it means. Type it in French (accents and capitals don't matter).</p>
        <anvil-component type="Label" name="quiz_prompt" prop:role='["sv-quiz-prompt"]'></anvil-component>
        <anvil-component type="TextBox" name="quiz_box" prop:placeholder="En français..."></anvil-component>
        <anvil-component type="Label" name="quiz_result" prop:role='["sv-quiz-result"]'></anvil-component>
        <div class="ui-row end">
          <anvil-component type="Button" name="quiz_show" prop:text="Show me" prop:role='["btn", "btn-ghost"]'></anvil-component>
          <anvil-component type="Button" name="quiz_check" prop:text="Check" prop:role='["btn", "btn-primary"]'></anvil-component>
          <anvil-component type="Button" name="quiz_next" prop:text="Next" prop:role='["btn", "btn-primary", "ic-arrow"]'></anvil-component>
        </div>
      </div>

      <anvil-component type="RepeatingPanel" name="notes_panel" prop:item_template="parapeet.Items.NoteRow" prop:role='["sv-list"]'></anvil-component>
      <div class="ui-empty" anvil:name="empty">
        <i class="ic ic-bookmark"></i>
        <h3>Nothing saved yet</h3>
        <p>Tap <b>Save</b> on any card in the phrasebook, or add your own phrases here.</p>
        <a class="ui-btn primary" href="#practice">Open the phrasebook</a>
      </div>
    </div>
  </anvil-block>
</anvil-form>
