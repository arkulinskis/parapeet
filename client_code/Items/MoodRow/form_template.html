<div class="ix cm-host">
<div class="cm-row" anvil:name="row">
  <span class="cm-ic" anvil:name="icon_box"><i class="ic" anvil:name="icon"></i></span>
  <div class="cm-body">
    <div class="cm-head">
      <anvil-component type="Label" name="label" prop:role='["strong"]' bind:text="self.item['label']"></anvil-component>
      <anvil-component type="Label" name="who" prop:role='["fine-print"]'></anvil-component>
      <anvil-component type="Label" name="register" prop:role='["badge"]' bind:text="self.item['register']" bind:visible="bool(self.item['register'])"></anvil-component>
    </div>
    <div class="cm-fr" lang="fr" anvil:dom-node="fr"></div>
    <anvil-component type="Label" name="en" prop:role='["fine-print"]' bind:text="self.item['en']"></anvil-component>
  </div>
  <div class="cm-actions">
    <anvil-component type="Button" name="listen_button" prop:text="Listen" prop:role='["btn", "btn-sm", "btn-icon", "ic-volume"]'></anvil-component>
    <anvil-component type="Button" name="go_button" prop:text="Go" prop:role='["btn", "btn-sm"]'></anvil-component>
  </div>
</div>
</div>
