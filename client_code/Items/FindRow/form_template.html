<div class="ix fd-host">
<article class="fd-row" anvil:name="row">
  <div class="fd-row-head">
    <span class="fd-mood"><i class="ic" anvil:name="mood_icon"></i><anvil-component type="Label" name="mood_label" prop:role='["fd-mood-text"]'></anvil-component></span>
    <anvil-component type="Label" name="register_label" prop:role='["badge", "badge-brand"]'></anvil-component>
  </div>
  <anvil-component type="Label" name="text_label" prop:role='["fd-text"]'></anvil-component>
  <anvil-component type="Label" name="en_label" prop:role='["fine-print"]'></anvil-component>
  <div class="fd-actions">
    <anvil-component type="Button" name="listen_button" prop:text="Listen" prop:role='["btn", "btn-sm", "ic-volume"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-sm", "ic-bookmark"]'></anvil-component>
    <anvil-component type="Button" name="moods_button" prop:text="All moods" prop:role='["btn", "btn-sm", "ic-palette"]'></anvil-component>
    <anvil-component type="Button" name="open_button" prop:text="Open card" prop:role='["btn", "btn-sm", "btn-primary", "ic-cards"]'></anvil-component>
  </div>
</article>
</div>
