<div class="ui note-edit">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]' prop:text="Save to your phrasebook"></anvil-component>
  <div class="ui-stack">
    <label class="ui-field"><anvil-component type="Label" name="fr_label" prop:text="French" prop:role='["field-label"]'></anvil-component>
      <anvil-component type="TextArea" name="fr_box" prop:placeholder="Je voulais te dire..." prop:height="80"></anvil-component>
    </label>
    <label class="ui-field"><span>What it means <em>(and a note to yourself)</em></span>
      <anvil-component type="TextArea" name="en_box" prop:placeholder="I wanted to tell you..." prop:height="80"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-bookmark"]'></anvil-component>
    </div>
  </div>
</div>
