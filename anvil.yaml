metadata: {description: 'Last year a magic parakeet got loose.\nThis klepto stole everyone''s knowledge of French.\n\nAfter months of prep and grind..\nwe are finally ready. \n\nWe want swipers, actors, haters, lovers.. \npassion is what this will take.\n\nCatch Parapeet!', logo_img: 'asset:Parapeet-super-zoom.png', title: Catch the lingo - Parapeet}
name: Parapeet
native_deps:
  head_html: "<meta content='yes' name='apple-mobile-web-app-capable'/>\n<meta content='yes' name='mobile-web-app-capable'/>\n\n<meta name=\"google-site-verification\" content=\"At5SeHH35hDUlQkpygEDLmSBHiDtVGt20twoJSzOYOs\" />\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta name=\"description\" content=\"Parapeet: Perfect Your Advanced French Language Skills\">\n  <meta name=\"keywords\" content=\"advanced French learning, language learning app, perfect French, Parapeet\n  , Advanced French language learning, Expert French phrases, Perfecting French skills, Advanced French vocabulary\n  , Fluent French conversation, French idioms and expressions, Enhance French pronunciation, Mastering complex French\n  , French language proficiency, Expert French communication, Advanced language practice, Elevate your French\n  , Parapeet language app, Parapeet advanced French, French language fluency, Polishing French skills, Advanced language resources\n  , Professional French communication, Expertise in French language, Complex French grammar, Advanced language exercises\n  , Fine-tuning French accent, Specialized French phrases, Advanced French fluency, High-level French practice\n  , Expertise in advanced French, Complex French conversations, Advanced French learning techniques, Profound French vocabulary\n  , Fluent communication in French, Mastery of French language, Advanced French writing skills, Advanced French learning journey\n  , Perfecting French grammar, Proficiency in advanced French, Advanced French language challenges, French language mastery program\n  , Advanced French conversation practice, Expert-level French proficiency, Advanced French learning platform\">\n  <meta name=\"author\" content=\"Arkvital\">\n    \n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans&display=swap\" rel=\"stylesheet\">\n  \n  <script async src=\"https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3860896077231195\" crossorigin=\"anonymous\"></script>\n\n  <meta name=\"msapplication-TileColor\" content=\"#2e7d32\">\n  <meta name=\"msapplication-TileImage\" content=\"https://parapeet.com/_/theme/Parapeet-super-zoom.png\">\n  <meta name=\"theme-color\" content=\"#2e7d32\">\n  <meta name=\"background-color\" content=\"#b5e655\">\n\n<script>\ndocument.querySelector('meta[name=\"theme-color\"]').setAttribute(\"content\", \"#2e7d32\");\ndocument.querySelector('meta[name=\"background-color\"]').setAttribute(\"content\", \"#b5e655\");\ndocument.querySelector(\"link[rel='manifest']\").setAttribute('href', '_/theme/manifest.json');\n</script>\n\n\n\n<script>\n\n  \nfunction isScreenLockSupported() {\n  return ('wakeLock' in navigator);\n}\nvar screenLock;\nasync function lockWakeState() {\n  console.log(\"asked to keep awake\");\n  if(isScreenLockSupported()){\n    try {\n       screenLock = await navigator.wakeLock.request('screen');\n    } catch(err) {\n       console.log(err.name, err.message);\n    }\n    return screenLock;\n  }\n}\nfunction releaseWakeState() { \n  console.log(\"asked to be able to sleep\");\n  if(typeof screenLock !== \"undefined\" && screenLock != null) {\n    screenLock.release()\n    .then(() => {\n      console.log(\"Lock released 🎈\");\n      screenLock = null;\n    });\n  }\n}  \n</script>\n\n<div class=\"bg\"></div>\n<!-- <div class=\"bg bg2\"></div>\n<div class=\"bg bg3\"></div> -->\n\n<script>\n  function similarity(s1, s2) {\n  var longer = s1;\n  var shorter = s2;\n  if (s1.length < s2.length) {\n    longer = s2;\n    shorter = s1;\n  }\n  var longerLength = longer.length;\n  if (longerLength == 0) {\n    return 1.0;\n  }\n  return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);\n}\n  function editDistance(s1, s2) {\n  s1 = s1.toLowerCase();\n  s2 = s2.toLowerCase();\n\n  var costs = new Array();\n  for (var i = 0; i <= s1.length; i++) {\n    var lastValue = i;\n    for (var j = 0; j <= s2.length; j++) {\n      if (i == 0)\n        costs[j] = j;\n      else {\n        if (j > 0) {\n          var newValue = costs[j - 1];\n          if (s1.charAt(i - 1) != s2.charAt(j - 1))\n            newValue = Math.min(Math.min(newValue, lastValue),\n              costs[j]) + 1;\n          costs[j - 1] = lastValue;\n          lastValue = newValue;\n        }\n      }\n    }\n    if (i > 0)\n      costs[s2.length] = lastValue;\n  }\n  return costs[s2.length];\n}\n</script>\n\n<div style=\"background: url('_/theme/tallbush.png') no-repeat;  height: 100vh; opacity:0.2; position: fixed; top:0; left: 0; width: 100vw; margin:0px; padding:0px;\"></div>\n\n<audio id=\"myaudio\"><source id=\"mysource\"></source></audio>\n"
