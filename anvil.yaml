    <script src="_/theme/pp-card.js?v=75c171c501"></script>
    <script src="_/theme/pp-audio.js?v=0343b560db"></script>
package_name: parapeet
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    share_login_status: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/files.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/stripe.yml
startup:
  module: startup
  type: module
